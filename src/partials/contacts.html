<section class="contact-section" id="contacts">
  <div class="container">
    <div class="header-block">
      <span class="subtitle">Connect</span>
      <h2 class="title">Order your unique jewelry</h2>
      <p class="description">We'd love to hear more details from you!</p>
    </div>

    <div class="content-grid">
      
      <div class="form-wrapper">
        <form class="form" onsubmit="event.preventDefault()">
          
          <div class="field-group">
            <label class="label" for="user-name">Name*</label>
            <input 
              class="input" 
              type="text" 
              id="user-name" 
              name="name" 
              placeholder="Tony" 
              required 
              pattern="^[a-zA-Z\s\.]{5,28}$" 
            />
          </div>

          <div class="field-group">
            <label class="label" for="user-phone">Phone*</label>
            <input 
              class="input" 
              type="tel" 
              id="user-phone" 
              name="phone" 
              placeholder="+1 234 567 8900" 
              required 
              pattern="^\+[0-9\s]{14}$" 
            />
          </div>

          <div class="field-group">
            <label class="label" for="user-message">Describe what you want</label>
            <textarea 
              class="textarea" 
              id="user-message" 
              name="message" 
              placeholder="Type your message..." 
              maxlength="500"
            ></textarea>
          </div>

          <button class="submit-btn" type="submit">Submit</button>
        </form>
      </div>

      <ul class="info-wrapper">
        <li class="info-item">
          <div class="icon-wrapper">
            <svg width="32" height="32">
              <use href="./img/sprite.svg#envelope"></use>
            </svg>
          </div>
          <div class="info-content">
            <span class="info-title">Email</span>
            <a href="mailto:info@handmadejewelry.com" class="info-link">info@handmadejewelry.com</a>
          </div>
        </li>

        <li class="info-item">
          <div class="icon-wrapper">
            <svg width="32" height="32">
              <use href="./img/sprite.svg#phone"></use>
            </svg>
          </div>
          <div class="info-content">
            <span class="info-title">Phone</span>
            <a href="tel:+15550000000" class="info-link">+1 (555) 000-0000</a>
          </div>
        </li>

        <li class="info-item office-item">
          <div class="icon-wrapper">
            <svg width="32" height="32">
              <use href="./img/sprite.svg#map"></use>
            </svg>
          </div>
          <div class="info-content">
            <span class="info-title">Office</span>
            <a 
              href="https://maps.google.com/?q=76-8+Oakington+Manor+Dr,+London,+UK" 
              target="_blank" 
              rel="noopener noreferrer" 
              class="info-link"
            >
              76-8 Oakington Manor Dr, London, UK
            </a>
          </div>
        </li>
      </ul>

    </div>
  </div>
</section>
